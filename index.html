<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Seating Randomizer</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container-fluid h-100 p-0">
        <div class="row h-100 g-0">
            <!-- Sidebar / Control Panel -->
            <div class="col-md-3 col-lg-3 sidebar d-flex flex-column p-4 glass-panel">
                <h3 class="mb-4 fw-bold"><i class="bi bi-people-fill me-2"></i>Seating Plan</h3>

                <div class="mb-4">
                    <label class="form-label text-muted small text-uppercase fw-bold">Controls</label>
                    <div class="d-grid gap-2">
                        <button id="btn-random" class="btn btn-primary btn-lg custom-btn">
                            <span class="d-flex align-items-center justify-content-center">
                                Randomize Seats ✨
                            </span>
                        </button>
                    </div>

                    <div class="d-flex gap-2 mt-3 pt-3 border-top border-white-10">
                        <button id="btn-import-trigger" class="btn btn-dark btn-sm glass-btn flex-fill">
                            <i class="bi bi-upload me-2"></i>Import JSON
                        </button>
                        <button id="btn-export" class="btn btn-dark btn-sm glass-btn flex-fill">
                            <i class="bi bi-download me-2"></i>Export JSON
                        </button>
                        <input type="file" id="file-import" accept=".json" style="display: none;">
                    </div>
                </div>

                <div class="flex-grow-1 overflow-auto members-list" id="team-summary">
                    <!-- Team summary will be injected here -->
                    <div class="text-muted text-center mt-5">Loading data...</div>
                </div>

                <div class="mt-auto pt-3 border-top border-secondary-subtle">
                    <small class="text-secondary">Total Members: <span id="total-count" class="fw-bold">0</span></small>
                </div>
            </div>

            <!-- Main Content / Seat Map -->
            <div
                class="col-md-9 col-lg-9 main-content p-4 d-flex flex-column align-items-center justify-content-center">
                <div class="seat-map-container" id="seat-map">
                    <!-- Seats will be generated here -->
                    <div class="text-center">
                        <h3>Ready to organize?</h3>
                        <p class="text-muted">Click "Randomize Seats" to start arranging the team.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
